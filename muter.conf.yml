executable: /usr/bin/xcodebuild
arguments:
  - -project
  - src/umalog.xcodeproj
  - -scheme
  - umalog
  - -destination
  - platform=iOS Simulator,name=iPhone 16e,OS=18.6
  - -only-testing:umalogTests
  - test
exclude:
  - src/umalog/Views/
  - src/umalog/umalogApp.swift
  - src/umalog/ContentView.swift
  - src/umalog/Utils/VenuePresets.swift
  - src/umalog/ShakeWindow.swift
excludeCalls: []
