disabled_rules:
  - for_where
  - trailing_comma
  - type_name
  - opening_brace

identifier_name:
  min_length:
    warning: 2
    error: 2
  excluded:
    - id
    - url
    - i
    - n
    - x
    - y
    - z

type_body_length:
  warning: 400
  error: 500

function_body_length:
  warning: 100
  error: 150

file_length:
  warning: 500
  error: 700

line_length:
  warning: 150
  error: 200
