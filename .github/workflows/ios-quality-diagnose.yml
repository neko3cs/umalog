name: iOS 結果の調査（一時）
on:
  push:
    branches: [codex/issue-66-ios-quality]
    paths: [.github/workflows/ios-quality-diagnose.yml]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 結果を取得
        run: |
          gh run download 41960835476 -R neko3cs/umalog -n ios-quality-41960835476-1 -D results
          gh run download 41960835476 -R neko3cs/umalog -n unit-results-41960835476-1 -D unit
          mkdir diagnosis
      - name: 失敗箇所と添付を抽出
        run: |
          xcrun xcresulttool get test-results test-details --path results/ui.xcresult \
            --test-id 'JSON取り込みTest/testレース一覧から取り込むとプレビューが出て保存するとレースと出走馬が登録される()' \
            > diagnosis/failure-details.json
          xcrun xcresulttool get test-results activities --path results/ui.xcresult \
            --test-id 'JSON取り込みTest/testレース一覧から取り込むとプレビューが出て保存するとレースと出走馬が登録される()' \
            > diagnosis/failure-activities.json
          xcrun xcresulttool export attachments --path results/ui.xcresult \
            --output-path diagnosis/attachments --only-failures
      - name: 計測済みカバレッジを抽出
        if: ${{ always() }}
        run: |
          xcrun xcresulttool merge unit/unit.xcresult results/ui.xcresult --output-path merged.xcresult
          xcrun xccov view --report --json merged.xcresult > diagnosis/merged-coverage.json
      - name: 調査結果を保存
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnosis-${{ github.run_id }}
          path: diagnosis
          retention-days: 7
