name: iOS 品質チェック

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
      RESULTS: quality-results
      SWIFTFORMAT_VERSION: 0.64.4
      SWIFTLINT_VERSION: 0.63.3

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 実行環境を記録
        run: |
          mkdir -p "$RESULTS"
          {
            date -u
            git rev-parse HEAD
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
            xcrun simctl list devices available
            df -h
          } 2>&1 | tee "$RESULTS/environment.log"
          {
            echo "## 検証対象"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Xcode 27.1 / iPhone 18 Pro / iOS 27.0 / UI 2並列"
            echo "手動確認の結果はこのワークフローには含まれません。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 固定版の整形・Lintツールを準備
        run: |
          tools="$RUNNER_TEMP/quality-tools"
          mkdir -p "$tools/format" "$tools/lint"
          curl --fail --location --retry 3 \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip" \
            --output "$tools/swiftformat.zip"
          curl --fail --location --retry 3 \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip" \
            --output "$tools/swiftlint.zip"
          printf '%s  %s\n' \
            bb42fbfb0b9d5f1b8b83db3147087220ea414916fce8c5cf71abaea5ad5a3175 "$tools/swiftformat.zip" \
            fb045e85e7cb3374f42a4840b6b85a0106302afa69035c0c6f29af4a44c810b6 "$tools/swiftlint.zip" \
            | shasum -a 256 --check
          unzip -q "$tools/swiftformat.zip" -d "$tools/format"
          unzip -q "$tools/swiftlint.zip" -d "$tools/lint"
          chmod +x "$tools/format/swiftformat" "$tools/lint/swiftlint"
          test "$("$tools/format/swiftformat" --version)" = "$SWIFTFORMAT_VERSION"
          test "$("$tools/lint/swiftlint" version)" = "$SWIFTLINT_VERSION"
          printf '%s\n' "$tools/format" "$tools/lint" >> "$GITHUB_PATH"
          printf 'SwiftFormat %s\nSwiftLint %s\n' \
            "$SWIFTFORMAT_VERSION" "$SWIFTLINT_VERSION" | tee "$RESULTS/tools.log"

      - name: 整形チェック
        run: |
          swiftformat src/umalog src/umalogTests --swiftversion 6.2 \
            --lint --reporter github-actions-log 2>&1 | tee "$RESULTS/format.log"

      - name: カバレッジ判定スクリプトのテスト
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Lint
        run: |
          swiftlint lint --config .swiftlint.yml --strict \
            --reporter github-actions-logging 2>&1 | tee "$RESULTS/lint.log"

      - name: Simulatorを起動
        timeout-minutes: 10
        run: |
          devices="$(xcrun simctl list devices available --json)"
          device_id="$(jq -er '
            [.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-0"][]
             | select(.name == "iPhone 18 Pro")]
            | if length == 1 then .[0].udid else error("Simulator must be unique") end
          ' <<< "$devices")"
          state="$(jq -r --arg id "$device_id" \
            '.devices[][] | select(.udid == $id) | .state' <<< "$devices")"
          if [ "$state" != "Booted" ]; then
            xcrun simctl boot "$device_id"
          fi
          xcrun simctl bootstatus "$device_id" -b 2>&1 | tee "$RESULTS/simulator.log"

      - name: 全ユニットテスト（ビルドを含む）
        timeout-minutes: 30
        run: |
          /usr/bin/time -p xcodebuild test \
            -project src/umalog.xcodeproj -scheme umalog \
            -destination "$DESTINATION" \
            -only-testing:umalogTests \
            -onlyUsePackageVersionsFromResolvedFile \
            -enableCodeCoverage YES \
            -resultBundlePath "$RESULTS/unit.xcresult" \
            2>&1 | tee "$RESULTS/unit.log"

      - name: 全UIテスト
        timeout-minutes: 40
        run: |
          /usr/bin/time -p xcodebuild test \
            -project src/umalog.xcodeproj -scheme umalog \
            -destination "$DESTINATION" \
            -only-testing:umalogUITests \
            -onlyUsePackageVersionsFromResolvedFile \
            -parallel-testing-worker-count 2 \
            -enableCodeCoverage YES \
            -resultBundlePath "$RESULTS/ui.xcresult" \
            2>&1 | tee "$RESULTS/ui.log"

      - name: 合算行カバレッジを判定
        run: |
          for suite in unit ui; do
            xcrun xccov view --report --json "$RESULTS/$suite.xcresult" \
              > "$RESULTS/$suite-coverage.json"
          done
          xcrun xcresulttool merge "$RESULTS/unit.xcresult" "$RESULTS/ui.xcresult" \
            --output-path "$RESULTS/merged.xcresult"
          xcrun xccov view --report --json "$RESULTS/merged.xcresult" \
            > "$RESULTS/merged-coverage.json"
          xcrun xccov view --report --only-targets "$RESULTS/merged.xcresult" \
            > "$RESULTS/coverage.txt"
          python3 .github/scripts/check_coverage.py \
            "$RESULTS/unit-coverage.json" "$RESULTS/ui-coverage.json" \
            "$RESULTS/merged-coverage.json" 2>&1 | tee "$RESULTS/coverage-check.txt"

      - name: テスト件数・結果・成果物容量を記録
        if: ${{ always() && !cancelled() }}
        run: |
          for suite in unit ui; do
            if [ -d "$RESULTS/$suite.xcresult" ]; then
              xcrun xcresulttool get test-results summary \
                --path "$RESULTS/$suite.xcresult" > "$RESULTS/$suite-summary.json"
            fi
          done
          {
            echo "## 合算行カバレッジ"
            if [ -f "$RESULTS/coverage-check.txt" ]; then
              cat "$RESULTS/coverage-check.txt"
            else
              echo "未確認：全テストとカバレッジ判定が完了していません。"
            fi
            echo "## 成果物容量（圧縮前）"
            du -sh "$RESULTS"
          } | tee "$RESULTS/summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: 結果とログを保存
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS }}
          retention-days: 7
          if-no-files-found: warn
