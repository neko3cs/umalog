name: iOS 品質チェック

on:
  workflow_dispatch:
  # converted_to_draft starts a run whose jobs are all skipped; it exists only
  # so that run's concurrency group cancels the one already in progress.
  pull_request:
    types: [opened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
  SWIFTFORMAT_VERSION: 0.64.4
  SWIFTLINT_VERSION: 0.63.3
  UI_GROUP_A: |-
    JSON取り込みTest
    競馬場選択Test
    券種選択Test
    ZIP往復Test
    データ初期化Test
    レース追加Test
    設定Test
    レース削除Test
    タブバーナビゲーションTest

jobs:
  checks:
    name: 整形・Lint
    # tests and coverage need this job, so skipping it skips the whole run.
    # Fork PRs are skipped so outside code never runs on the xcode-27 runners.
    if: >-
      ${{ github.event_name != 'pull_request'
          || (!github.event.pull_request.draft
              && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      RESULTS: quality-results

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 実行環境を記録
        run: |
          mkdir -p "$RESULTS"
          {
            xcodebuild -version
            swift --version
          } 2>&1 | tee "$RESULTS/environment.log"

      - name: 固定版の整形・Lintツールを準備
        run: |
          tools="$RUNNER_TEMP/quality-tools"
          mkdir -p "$tools/format" "$tools/lint"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip" \
            --output "$tools/swiftformat.zip"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip" \
            --output "$tools/swiftlint.zip"
          printf '%s  %s\n' \
            bb42fbfb0b9d5f1b8b83db3147087220ea414916fce8c5cf71abaea5ad5a3175 "$tools/swiftformat.zip" \
            fb045e85e7cb3374f42a4840b6b85a0106302afa69035c0c6f29af4a44c810b6 "$tools/swiftlint.zip" \
            | shasum -a 256 --check --quiet
          unzip -q "$tools/swiftformat.zip" -d "$tools/format"
          unzip -q "$tools/swiftlint.zip" -d "$tools/lint"
          chmod +x "$tools/format/swiftformat" "$tools/lint/swiftlint"
          test "$("$tools/format/swiftformat" --version)" = "$SWIFTFORMAT_VERSION"
          test "$("$tools/lint/swiftlint" version)" = "$SWIFTLINT_VERSION"
          printf '%s\n' "$tools/format" "$tools/lint" >> "$GITHUB_PATH"

      - name: 整形チェック
        run: |
          swiftformat src/umalog src/umalogTests --swiftversion 6.2 \
            --lint --reporter github-actions-log 2>&1 | tee "$RESULTS/format.log"

      - name: Lint
        run: |
          swiftlint lint --config .swiftlint.yml --strict \
            --reporter github-actions-logging 2>&1 | tee "$RESULTS/lint.log"

      - name: 整形・Lint結果を保存
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: check-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS }}
          retention-days: 7
          if-no-files-found: warn

  tests:
    name: ${{ matrix.suite }}
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, ui-a, ui-b]
    env:
      SUITE: ${{ matrix.suite }}
      RESULTS: quality-results/${{ matrix.suite }}
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Simulatorを起動
        timeout-minutes: 10
        run: |
          mkdir -p "$RESULTS"
          devices="$(xcrun simctl list devices available --json)"
          device_id="$(jq -er '
            [.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-0"][]
             | select(.name == "iPhone 18 Pro")]
            | if length == 1 then .[0].udid else error("Simulator must be unique") end
          ' <<< "$devices")"
          state="$(jq -r --arg id "$device_id" \
            '.devices[][] | select(.udid == $id) | .state' <<< "$devices")"
          if [ "$state" != "Booted" ]; then
            xcrun simctl boot "$device_id"
          fi
          xcrun simctl bootstatus "$device_id" -b 2>&1 | tee "$RESULTS/simulator.log"

      - name: テスト（ビルドを含む）
        timeout-minutes: 60
        run: |
          if [ "$SUITE" = unit ]; then
            selectors=(-only-testing:umalogTests)
          else
            selectors=(-parallel-testing-enabled NO)
            if [ "$SUITE" = ui-a ]; then
              filter=only
            else
              filter=skip
              selectors+=(-only-testing:umalogUITests)
            fi
            while IFS= read -r test_class; do
              selectors+=("-$filter-testing:umalogUITests/$test_class")
            done <<< "$UI_GROUP_A"
          fi
          xcodebuild test -quiet \
            -project src/umalog.xcodeproj -scheme umalog \
            -destination "$DESTINATION" \
            "${selectors[@]}" \
            -onlyUsePackageVersionsFromResolvedFile \
            -enableCodeCoverage YES \
            -resultBundlePath "$RESULTS/tests.xcresult" \
            2>&1 | tee "$RESULTS/tests.log"

      - name: テスト結果を抽出
        if: ${{ always() && !cancelled() }}
        run: |
          if [ -d "$RESULTS/tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RESULTS/tests.xcresult" > "$RESULTS/summary.json"
            xcrun xcresulttool get test-results tests \
              --path "$RESULTS/tests.xcresult" > "$RESULTS/test-tree.json"
            xcrun xccov view --report --json "$RESULTS/tests.xcresult" \
              > "$RESULTS/coverage.json"
          fi

      - name: テスト結果とログを保存
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ github.run_id }}-${{ matrix.suite }}
          path: quality-results
          overwrite: true
          retention-days: 7
          if-no-files-found: warn

  coverage:
    name: 合算カバレッジ
    needs: [checks, tests]
    if: ${{ always() && !cancelled() && needs.checks.result == 'success' }}
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      RESULTS: quality-results
      TEST_RESULT: ${{ needs.tests.result }}
    steps:
      - name: 各テスト結果を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-${{ github.run_id }}-*
          path: ${{ env.RESULTS }}
          merge-multiple: true

      - name: 全グループの成功を確認
        run: |
          test "$TEST_RESULT" = success
          jq -es 'length == 3 and all(.[];
            .result == "Passed" and .totalTestCount > 0
            and .failedTests == 0 and .skippedTests == 0)
          ' "$RESULTS/unit/summary.json" "$RESULTS/ui-a/summary.json" \
            "$RESULTS/ui-b/summary.json" > /dev/null

      - name: 合算行カバレッジを判定
        run: |
          xcrun xcresulttool merge "$RESULTS/unit/tests.xcresult" \
            "$RESULTS/ui-a/tests.xcresult" "$RESULTS/ui-b/tests.xcresult" \
            --output-path "$RESULTS/merged.xcresult"
          xcrun xccov view --report --json "$RESULTS/merged.xcresult" \
            > "$RESULTS/merged-coverage.json"
          jq -ers '
            map([.targets[] | select(.name == "umalog.app")])
            | if all(.[]; length == 1) then map(.[0])
              else error("umalog.appの計測対象が欠落または重複しています") end
            | if all(.[];
                ([.coveredLines, .executableLines] | all(.[]; type == "number" and floor == .))
                and .executableLines > 0 and .coveredLines >= 0
                and .coveredLines <= .executableLines)
              then .[-1]
              else error("計測行数が不正または0です。結果を確認して再実行してください") end
            | "umalog.app 合算行カバレッジ: \(.coveredLines)/\(.executableLines)行（\(.coveredLines / .executableLines * 100)%）、基準: 85%以上" as $summary
            | if .coveredLines * 100 >= .executableLines * 85
              then $summary + " — 合格" else error($summary + " — 基準未達") end
          ' \
            "$RESULTS/unit/coverage.json" "$RESULTS/ui-a/coverage.json" \
            "$RESULTS/ui-b/coverage.json" \
            "$RESULTS/merged-coverage.json" 2>&1 | tee "$RESULTS/coverage-check.txt"

      - name: 合算レポートを保存
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RESULTS }}/merged-coverage.json
            ${{ env.RESULTS }}/coverage-check.txt
          retention-days: 7
          if-no-files-found: warn
